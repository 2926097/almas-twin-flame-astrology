[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almas-twin-flame-astrology"
version = "1.7.1"
description = "Public scoring and validation core for ALMAS Metaphysical Relationship Astrology"
requires-python = ">=3.10"
authors = [{name = "Proyecto ALMAS"}]
readme = "README.md"

[project.scripts]
almas-score = "almas_tfa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
