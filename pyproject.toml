[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almas-twin-flame-astrology"
version = "1.0.0"
description = "Public scoring and validation core for the ALMAS Twin-Flame Astrology research skill"
requires-python = ">=3.10"
authors = [{name = "Proyecto ALMAS"}]
readme = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
