[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almas-twin-flame-astrology"
version = "1.24.0"
description = "Núcleo público de puntuación, validación y orquestación para la Astrología Metafísica Relacional ALMAS"
requires-python = ">=3.10"
authors = [{name = "Proyecto ALMAS"}]
readme = "README.md"

[project.optional-dependencies]
astronomy-moira = ["moira-astro==6.8.2"]
astronomy-validation = ["skyfield==1.55"]
schema-validation = ["jsonschema==4.26.0"]
publication-docx = ["python-docx==1.2.0"]
publication-pdf = ["pypdf==6.19.0"]

[project.scripts]
almas-score = "almas_tfa.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
almas_tfa = ["data/*.json"]
