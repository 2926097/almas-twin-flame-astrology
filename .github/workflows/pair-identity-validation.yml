name: Pair identity blind validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pair-identity-protocol:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ALMAS
        run: python -m pip install -e .

      - name: Run pair identity tests
        run: python -m unittest tests.test_pair_identity_validation -v

      - name: Run synthetic blind protocol
        run: python scripts/validate_pair_identity_protocol.py
