name: Backend astronómico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  moira-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar ALMAS con backend Moira
        run: python -m pip install -e ".[astronomy-moira]"

      - name: Validar API y versión de Moira
        run: python scripts/validate_astronomy_backend_runtime.py

      - name: Ejecutar tests del adaptador
        run: python -m unittest discover -s tests -p "test_production_astronomy.py" -v
