name: Backend astronómico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  calculated-points-precision:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
      DE440S_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar referencias de puntos calculados
        run: python -m pip install -e ".[schema-validation,astronomy-validation,calculated-point-validation]"

      - name: Descargar DE440s desde JPL/NAIF
        run: curl --fail --location --retry 3 "$DE440S_URL" --output /tmp/de440s.bsp

      - name: Verificar identidad exacta de DE440s
        run: echo "$DE440S_SHA256  /tmp/de440s.bsp" | sha256sum --check -

      - name: Comparar algoritmos sobre entradas idénticas
        run: |
          python scripts/validate_ssar_calculated_points_precision.py \
            --kernel /tmp/de440s.bsp \
            --output "/tmp/almas-ssar-calculated-points-${{ matrix.python-version }}.json"

      - name: Publicar recibo de precisión de puntos calculados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssar-calculated-points-py${{ matrix.python-version }}
          path: /tmp/almas-ssar-calculated-points-${{ matrix.python-version }}.json
          if-no-files-found: error

  moira-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar ALMAS con backends de astronomía/validación
        run: python -m pip install -e ".[astronomy-moira,astronomy-validation]"

      - name: Validar API y versión de Moira
        run: python scripts/validate_astronomy_backend_runtime.py

      - name: Validar API y versión de Skyfield
        run: python scripts/validate_skyfield_reference_runtime.py

      - name: Ejecutar tests del adaptador
        run: python -m unittest discover -s tests -p "test_production_astronomy.py" -v

      - name: Validar gate dorado preregistrado
        run: python -m unittest discover -s tests -p "test_astronomy_golden_validation.py" -v

      - name: Validar referencia Skyfield inyectable
        run: python -m unittest discover -s tests -p "test_skyfield_planetary_reference.py" -v

      - name: Validar referencia True Node de primeros principios
        run: python -m unittest discover -s tests -p "test_skyfield_true_node_reference.py" -v

      - name: Validar referencia Placidus independiente
        run: python -m unittest discover -s tests -p "test_skyfield_placidus_reference.py" -v

  golden-planets-de440:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      DE440S_SHA256: c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2
      DE440S_MD5: 3917ee56769db332790c751e2168843d
      DE440S_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar ALMAS y referencias independientes
        run: python -m pip install -e ".[astronomy-moira,astronomy-validation]"

      - name: Descargar DE440s desde JPL/NAIF
        run: curl --fail --location --retry 3 "$DE440S_URL" --output /tmp/de440s.bsp

      - name: Verificar identidad exacta de DE440s
        run: |
          echo "$DE440S_SHA256  /tmp/de440s.bsp" | sha256sum --check -
          echo "$DE440S_MD5  /tmp/de440s.bsp" | md5sum --check -

      - name: Ejecutar etapa planetaria dorada
        run: |
          python scripts/run_astronomy_golden_planetary.py \
            --kernel /tmp/de440s.bsp \
            --sha256 "$DE440S_SHA256" \
            --output-dir "/tmp/almas-golden-${{ matrix.python-version }}"

      - name: Publicar recibos de validación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astronomy-golden-planets-py${{ matrix.python-version }}
          path: /tmp/almas-golden-${{ matrix.python-version }}
          if-no-files-found: error

  golden-true-node-de440:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
