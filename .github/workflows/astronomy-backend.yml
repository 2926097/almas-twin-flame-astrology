      DE440S_URL: https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar ALMAS y referencia Placidus
        run: python -m pip install -e ".[astronomy-moira,astronomy-validation]"

      - name: Descargar DE440s desde JPL/NAIF
        run: curl --fail --location --retry 3 "$DE440S_URL" --output /tmp/de440s.bsp

      - name: Verificar identidad exacta de DE440s
        run: |
