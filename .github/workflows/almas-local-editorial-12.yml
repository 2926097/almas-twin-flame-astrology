# Cierre 2026-10-25: repetir este gate en el HEAD documental, sin heredar PASS históricos.
name: ALMAS Web · publicación editorial local 12 secciones
on:
  pull_request:
    paths:
      - 'apps/almas-web-preview/local_editorial_12.py'
      - 'apps/almas-web-preview/test_local_editorial_12.py'
      - '.github/workflows/almas-local-editorial-12.yml'
      - 'src/almas_tfa/pdf_publication.py'
      - 'src/almas_tfa/docx_publication.py'
  push:
    branches: [main]
    paths:
      - 'apps/almas-web-preview/local_editorial_12.py'
      - 'apps/almas-web-preview/test_local_editorial_12.py'
      - '.github/workflows/almas-local-editorial-12.yml'
permissions:
  contents: read
jobs:
  editorial-b5:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned local publication requirements
        run: python -m pip install --disable-pip-version-check -e '.[schema-validation,publication-docx,publication-pdf]'
      - name: Install offline PDF converter and embedded fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-liberation
      - name: Validate 12-section traceability and produce synthetic DOCX + PDF
        run: PYTHONPATH=src python -m unittest discover -s apps/almas-web-preview -p 'test_local_editorial_12.py' -v
      - name: Confirm no personal artifacts were uploaded
        run: |
          echo 'NO_GIT_ACTION_ARTIFACTS: synthetic files stay in temporary directories'
