name: ALMAS Daily Asteroid Ephemerides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/almas-daily-asteroids.yml'
      - 'tools/daily_asteroid_ephemeris.py'
      - 'tests/test_daily_asteroid_ephemeris.py'
  schedule:
    # Early publication and fallbacks for tomorrow's 01:00 Europe/Madrid alert.
    - cron: '17 18 * * *'
      timezone: "Europe/Madrid"
    - cron: '17 22 * * *'
      timezone: "Europe/Madrid"
    - cron: '17 0 * * *'
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      day:
        description: "Reference day YYYY-MM-DD (empty = Madrid date, next day after 17:00)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: almas-asteroid-ephemerides
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install astronomy engine
        run: python -m pip install --disable-pip-version-check pyswisseph==2.10.3.2
      - name: Run offline integrity tests
        run: python -m unittest discover -s tests -p 'test_daily_asteroid_ephemeris.py' -v
      # Reuse previously verified Swiss Ephemeris binaries across ephemeral runners.
      # A versioned immutable key prevents downloading on every scheduled run;
      # change the version deliberately when refreshing orbital source files.
      - name: Restore persistent Swiss Ephemeris cache
        id: swiss-cache
        uses: actions/cache/restore@v4
        with:
          path: .ephemeris-files
          key: almas-swiss-asteroids-2026-v2-${{ hashFiles('tools/daily_asteroid_ephemeris.py') }}
          restore-keys: |
            almas-swiss-asteroids-2026-v2-
            almas-swiss-asteroids-2026-v1
      - name: Determine target reference day in Europe/Madrid
        env:
          REQUESTED_DAY: ${{ inputs.day }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from datetime import date, datetime, timedelta
          from zoneinfo import ZoneInfo
          requested = os.environ.get("REQUESTED_DAY", "").strip()
          now_madrid = datetime.now(ZoneInfo("Europe/Madrid"))
          if requested:
              target = date.fromisoformat(requested)
          else:
              # Night-before triggers target tomorrow. Late executions after
              # midnight target today's Spanish civil date.
              target = now_madrid.date() + timedelta(days=int(now_madrid.hour >= 17))
          print(f"ALMAS reference day={target}, local clock={now_madrid.isoformat()}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"ALMAS_REFERENCE_DAY={target.isoformat()}", file=env)
          PY
      - name: Reuse verified dated output when present
        shell: bash
        run: |
          python - <<'PY'
          import json, math, os
          from datetime import date, timedelta
          from pathlib import Path
          day = date.fromisoformat(os.environ["ALMAS_REFERENCE_DAY"])
          previous, today = (day - timedelta(days=1)).isoformat(), day.isoformat()
          path = Path("data/public-asteroid-ephemerides") / f"{today}.json"
          try:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["schema_version"] == "1.2"
              assert data["reference_day_utc"] == today
              assert data["reference_time_utc"] == "09:00:00"
              assert data["checked_days"] == [previous, today]
              assert data["verified_complete"] is True
              assert data["chiron"]["number"] == 2060
              bodies = [data["asteroids"][str(n)]["positions"] for n in (2847, 1170, 4227, 3811, 3, 16, 433)]
              bodies += [data["planets"][name] for name in (
                  "sun", "moon", "mercury", "venus", "mars", "jupiter",
                  "saturn", "uranus", "neptune", "pluto", "true_node")]
              bodies += [data["chiron"]["positions"]]
              for obj in bodies:
                  for d in (previous, today):
                      pos = obj[d]
                      assert math.isfinite(pos["longitude_deg"])
                      assert math.isfinite(pos["speed_deg_per_day"])
                      assert pos["flags_returned"] & 2
          except (OSError, KeyError, TypeError, ValueError, AssertionError) as exc:
              print(f"Generate/repair {today}: {type(exc).__name__}: {exc}")
          else:
              print(f"Reusing verified {today}: no duplicate computation")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  print("ALMAS_REUSE=true", file=env)
          PY
      - name: Download missing files and calculate both days
        if: env.ALMAS_REUSE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          DAY="$ALMAS_REFERENCE_DAY"
          python tools/daily_asteroid_ephemeris.py \
            --date "$DAY" \
            --cache ".ephemeris-files" \
            --output "data/public-asteroid-ephemerides/$DAY.json"
      # Save only after the Python calculation has verified all mandatory
      # objects. Cache is an optimization, not the source of published truth.
      - name: Save Swiss Ephemeris cache after successful verification
        if: steps.swiss-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ephemeris-files
          key: almas-swiss-asteroids-2026-v2-${{ hashFiles('tools/daily_asteroid_ephemeris.py') }}
      # Independent output guard: do not push stale, Moshier, or incomplete data.
      - name: Verify published ephemeris contract
        shell: bash
        run: |
          set -euo pipefail
          DAY="$ALMAS_REFERENCE_DAY"
          python - "$DAY" <<'PY'
          import json, math, pathlib, sys
          from datetime import date, timedelta
          day = date.fromisoformat(sys.argv[1])
          previous = (day - timedelta(days=1)).isoformat()
          today = day.isoformat()
          p = pathlib.Path("data/public-asteroid-ephemerides") / f"{today}.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["schema_version"] == "1.2"
          assert data["reference_day_utc"] == today
          assert data["reference_time_utc"] == "09:00:00"
          assert data["checked_days"] == [previous, today]
          assert data["verified_complete"] is True
          for n in (2847, 1170, 4227, 3811, 3, 16, 433):
              obj = data["asteroids"][str(n)]["positions"]
              for d in (previous, today):
                  pos = obj[d]
                  assert math.isfinite(pos["longitude_deg"])
                  assert math.isfinite(pos["speed_deg_per_day"])
                  assert pos["flags_returned"] & 2, f"Asteroid {n} no Swiss"
          for name in ("sun", "moon", "mercury", "venus", "mars", "jupiter",
                       "saturn", "uranus", "neptune", "pluto", "true_node"):
              for d in (previous, today):
                  pos = data["planets"][name][d]
                  assert math.isfinite(pos["longitude_deg"])
                  assert math.isfinite(pos["speed_deg_per_day"])
                  assert pos["flags_returned"] & 2, f"Planet {name} no Swiss"
          assert data["chiron"]["number"] == 2060
          for d in (previous, today):
              pos = data["chiron"]["positions"][d]
              assert math.isfinite(pos["longitude_deg"])
              assert math.isfinite(pos["speed_deg_per_day"])
              assert pos["flags_returned"] & 2, "Chiron no Swiss"
          print(f"ALMAS CONTRACT PASSED: {today}, 7 mandatory asteroids + 11 planets/node + Chiron")
          PY
      # Prepublish a second, future-dated verified file on EVERY run.
      # This makes the 01:00 Madrid reader independent from same-night
      # GitHub scheduling latency: any previous-day run prepares that day.
      - name: Prepublish next reference day (T+1) with full Swiss validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          import os
          from datetime import date, timedelta
          from pathlib import Path
          import re
          import subprocess
          import sys

          base = date.fromisoformat(os.environ["ALMAS_REFERENCE_DAY"])
          tomorrow = (base + timedelta(days=1)).isoformat()
          previous = base.isoformat()
          output = Path("data/public-asteroid-ephemerides") / f"{tomorrow}.json"

          def validate(path):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["schema_version"] == "1.2"
              assert data["reference_day_utc"] == tomorrow
              assert data["reference_time_utc"] == "09:00:00"
              assert data["checked_days"] == [previous, tomorrow]
              assert data["verified_complete"] is True
              assert data["chiron"]["number"] == 2060
              assert data["chiron"]["source_file"] == "seas_18.se1"
              required = ["sepl_18.se1", "semo_18.se1", "seas_18.se1"]
              required += [f"ast{n // 1000}/se{n:05d}s.se1" for n in
                           (2847, 1170, 4227, 3811, 16, 433)]
              for name in required:
                  meta = data["files"][name]
                  assert re.fullmatch(r"[a-fA-F0-9]{64}", meta["sha256"]), name
              bodies = [data["asteroids"][str(n)]["positions"] for n in
                        (2847, 1170, 4227, 3811, 3, 16, 433)]
              bodies += [data["planets"][name] for name in (
                  "sun", "moon", "mercury", "venus", "mars", "jupiter",
                  "saturn", "uranus", "neptune", "pluto", "true_node")]
              bodies.append(data["chiron"]["positions"])
              for body in bodies:
                  for day in (previous, tomorrow):
                      pos = body[day]
                      assert math.isfinite(pos["longitude_deg"])
                      assert math.isfinite(pos["speed_deg_per_day"])
                      assert pos["flags_returned"] & 2, f"Not Swiss: {day}"
              return len(bodies)

          try:
              checked = validate(output)
              print(f"ALMAS T+1 PREPUBLISHED: reusing {tomorrow}, validated {checked} bodies")
          except (OSError, KeyError, TypeError, ValueError, AssertionError) as err:
              print(f"ALMAS T+1 BUILD: {tomorrow}; existing file missing/invalid: {err}")
              subprocess.run([
                  sys.executable, "tools/daily_asteroid_ephemeris.py",
                  "--date", tomorrow,
                  "--cache", ".ephemeris-files",
                  "--output", str(output)
              ], check=True)
              checked = validate(output)
              print(f"ALMAS T+1 PREPUBLISHED: generated {tomorrow}, validated {checked} bodies")
          PY
      - name: Update latest only for newest reference day
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          day = os.environ["ALMAS_REFERENCE_DAY"]
          root = Path("data/public-asteroid-ephemerides")
          latest = root / "latest.json"
          current = json.loads(latest.read_text(encoding="utf-8")) if latest.exists() else {}
          if current.get("reference_day_utc", "") <= day:
              content = (root / f"{day}.json").read_bytes()
              if not latest.exists() or latest.read_bytes() != content:
                  latest.write_bytes(content)
                  print(f"Updated latest -> {day}")
              else:
                  print(f"Latest unchanged: {day}")
          else:
              print(f"Preserved newer latest: {current['reference_day_utc']}")
          PY
      - name: Commit complete verified publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public-asteroid-ephemerides/
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "data: daily verified asteroid positions at 09 UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      # Failure diagnostics are generated in GitHub Actions, not in isolated ChatGPT Python.
      - name: Record DNS diagnostics after any workflow failure
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "date_utc=$(date -u +%FT%TZ)"
            echo "job=ALMAS Daily Asteroid Ephemerides"
            for domain in ephe.scryr.io www.astro.com github.com; do
              echo "=== DNS $domain ==="
              if timeout 8 getent ahostsv4 "$domain" | head -n 1; then
                echo "lookup_attempt_finished"
              else
                echo "lookup_failed_or_timed_out"
              fi
            done
          } | tee diagnostics/connectivity.txt
      - name: Attach workflow diagnostic report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: almas-connectivity-${{ github.run_id }}
          path: diagnostics/connectivity.txt
          if-no-files-found: ignore
