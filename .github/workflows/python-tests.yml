name: Núcleo Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar paquete
        run: python -m pip install -e .

      - name: Ejecutar tests del núcleo
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar contrato público
        run: python scripts/validate_public_contract.py
