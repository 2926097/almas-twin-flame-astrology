name: Núcleo Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar paquete
        run: python -m pip install -e .

      - name: Ejecutar pruebas del núcleo
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar contrato público
        run: python scripts/validate_public_contract.py
