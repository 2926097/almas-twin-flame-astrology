name: Publicación DOCX

on:
  push:
    branches: [main]
    paths:
      - "src/almas_tfa/docx_publication.py"
      - "src/almas_tfa/personal_reporting.py"
      - "src/almas_tfa/personal_authored_report.py"
      - "scripts/render_authored_report_docx.py"
      - "tests/test_docx_publication.py"
      - "examples/authored-report.synthetic.json"
      - "pyproject.toml"
      - ".github/workflows/publication-docx.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/almas_tfa/docx_publication.py"
      - "src/almas_tfa/personal_reporting.py"
      - "src/almas_tfa/personal_authored_report.py"
      - "scripts/render_authored_report_docx.py"
      - "tests/test_docx_publication.py"
      - "examples/authored-report.synthetic.json"
      - "pyproject.toml"
      - ".github/workflows/publication-docx.yml"

permissions:
  contents: read

jobs:
  docx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar publicación DOCX
        run: python -m pip install -e ".[publication-docx]"

      - name: Ejecutar tests DOCX
        run: python -m unittest discover -s tests -p "test_docx_publication.py" -v

      - name: Generar fixture DOCX
        run: |
          python scripts/render_authored_report_docx.py             examples/authored-report.synthetic.json             /tmp/almas-authored-report.docx             --receipt /tmp/almas-authored-report.receipt.json
          test -s /tmp/almas-authored-report.docx
          test -s /tmp/almas-authored-report.receipt.json
