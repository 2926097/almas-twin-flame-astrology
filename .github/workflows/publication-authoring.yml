name: Autoría DOCX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  publication-docx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar autoría DOCX
        run: python -m pip install -e ".[publication-docx]"

      - name: Ejecutar tests de autoría y DOCX
        run: python -m unittest discover -s tests -p "test_publication_authoring.py" -v

      - name: Validar contrato público
        run: python scripts/validate_public_contract.py
