name: Contrato público

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar contrato público ALMAS
        run: python scripts/validate_public_contract.py

      - name: Validar coherencia del piloto documental RRA
        run: python scripts/validate_rra_documentary_inventory.py

      - name: Probar bloqueos documentales RRA
        run: python -m unittest discover -s tests -p test_rra_documentary_inventory.py -v
