name: Publicación PDF

on:
  push:
    branches: [main]
    paths:
      - "src/almas_tfa/pdf_publication.py"
      - "scripts/publish_authored_report_pdf.py"
      - "tests/test_pdf_publication.py"
      - "src/almas_tfa/docx_publication.py"
      - "examples/authored-report.synthetic.json"
      - "pyproject.toml"
      - ".github/workflows/publication-pdf.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/almas_tfa/pdf_publication.py"
      - "scripts/publish_authored_report_pdf.py"
      - "tests/test_pdf_publication.py"
      - "src/almas_tfa/docx_publication.py"
      - "examples/authored-report.synthetic.json"
      - "pyproject.toml"
      - ".github/workflows/publication-pdf.yml"

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar LibreOffice y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer poppler-utils fonts-liberation fonts-crosextra-carlito

      - name: Instalar publicación
        run: python -m pip install -e ".[publication-docx,publication-pdf]"

      - name: Ejecutar tests PDF
        run: python -m unittest discover -s tests -p "test_pdf_publication.py" -v

      - name: Publicar fixture PDF
        run: |
          python scripts/publish_authored_report_pdf.py \
            examples/authored-report.synthetic.json \
            /tmp/almas-authored-report.pdf \
            --docx-out /tmp/almas-authored-report.docx \
            --receipt /tmp/almas-authored-report.pdf.receipt.json
          test -s /tmp/almas-authored-report.docx
          test -s /tmp/almas-authored-report.pdf
          test -s /tmp/almas-authored-report.pdf.receipt.json

      - name: Render smoke test
        run: |
          mkdir -p /tmp/almas-pages
          pdftoppm -png -r 120 \
            /tmp/almas-authored-report.pdf \
            /tmp/almas-pages/page
          count=$(find /tmp/almas-pages -maxdepth 1 -name "page-*.png" | wc -l)
          test "$count" -ge 13
